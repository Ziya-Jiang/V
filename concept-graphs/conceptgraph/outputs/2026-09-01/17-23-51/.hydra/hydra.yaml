hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(levelname)s][m:%(module)s][fn:%(funcName)s][ln:%(lineno)d]
          - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: RUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.mode=RUN
    task:
    - repo_root=/mnt/ssd/user/V/concept-graphs
    - dataset_root=/mnt/ssd/user/V/concept-graphs/data
    - scene_id=2026-09-01--16-55-31_preprocessed
    - dataset_config=/mnt/ssd/user/V/concept-graphs/data/2026-09-01--16-55-31_preprocessed/dataconfig.yaml
    - stride=5
    - classes_file=/mnt/ssd/user/V/concept-graphs/conceptgraph/tableware_classes.txt
    - detections_exp_suffix=s_detections_stride5_tableware
    - exp_suffix=r_mapping_stride5_tableware
    - force_detection=true
  job:
    name: rerun_realtime_mapping
    chdir: null
    override_dirname: classes_file=/mnt/ssd/user/V/concept-graphs/conceptgraph/tableware_classes.txt,dataset_config=/mnt/ssd/user/V/concept-graphs/data/2026-09-01--16-55-31_preprocessed/dataconfig.yaml,dataset_root=/mnt/ssd/user/V/concept-graphs/data,detections_exp_suffix=s_detections_stride5_tableware,exp_suffix=r_mapping_stride5_tableware,force_detection=true,repo_root=/mnt/ssd/user/V/concept-graphs,scene_id=2026-09-01--16-55-31_preprocessed,stride=5
    id: ???
    num: ???
    config_name: rerun_realtime_mapping
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.2
    version_base: '1.3'
    cwd: /mnt/ssd/user/V/concept-graphs/conceptgraph
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /mnt/ssd/user/V/concept-graphs/conceptgraph/hydra_configs
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: /mnt/ssd/user/V/concept-graphs/conceptgraph/outputs/2026-09-01/17-23-51
    choices:
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: custom_logging_format
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: true
