name: gripperR
type: LingkongCanGripper
joint_size: 1
urdf_joints: ["gripper_J1_r"]
urdf_links: ["gripper_L1_r", "gripper_L2_r"]
panel_display_joint_names: ["R_gripper"]
offset_from_ee: [0, 0, -0.10]
hardware:
  # Erazor 只读探测确认 can1 为 1 Mbps，但节点 1..32 尚无回复。
  # 在确认供电、接线、节点和机械端点前必须保持 calibrated: false。
  interface_name: "can1"
  node_id: 8
  calibrated: false
  open_angle_deg: -800.0
  closed_angle_deg: -125.0
  speed_dps: 50
  torque_limit_raw: 200
  max_speed_dps: 200
  max_torque_limit_raw: 750
  min_angle_deg: -800.0
  max_angle_deg: 0.0
  max_temperature_c: 60
  min_voltage_v: 18.0
  max_voltage_v: 30.0
  response_timeout_ms: 300
  telemetry_period_ms: 200
  keepalive_ms: 500
  command_watchdog_ms: 1000
safety:
  joint_soft_limit:
    position: [[0], [1]]
  joint_hard_limit:
    position: [[0], [1]]
